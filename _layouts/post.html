---
layout: default
---
<article class="post"><p class="meta">{{ page.date | date: "%B %-d, %Y" }} · {{ page.tags | join: " · " }}</p><h1>{{ page.title }}</h1>
{% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}{{ content }}
<p class="back"><a href="{{ '/' | relative_url }}">← All entries</a></p></article>
